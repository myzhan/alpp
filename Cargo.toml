[package]
name = "alpp"
version = "0.1.0"
edition = "2021"
description = "ALPP - Any Language PreProcessor: comment-embedded #ifdef-style conditional compilation for any language"
license = "MIT"
repository = "https://github.com/myzhan/alpp"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
memchr = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tempfile = "3"
toml = "0.8"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "process"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
